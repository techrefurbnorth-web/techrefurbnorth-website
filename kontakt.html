<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kontakt – TechRefurbNorth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

  <div class="container py-5">

    <h1 class="mb-4">Kontakt</h1>
    <p class="lead">
      Du hast Fragen, möchtest ein Gerät verkaufen oder ein refurbished Modell kaufen?
      Schreib uns einfach – wir antworten schnell.
    </p>

    <hr class="border-secondary my-4">

    <form action="mailto:DEINE_EMAIL@domain.de" method="post" enctype="text/plain">

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="Name">
      </div>

      <div class="mb-3">
        <label class="form-label">E‑Mail</label>
        <input type="email" class="form-control" name="Email">
      </div>

      <div class="mb-3">
        <label class="form-label">Nachricht</label>
        <textarea class="form-control" name="Nachricht" rows="5"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Nachricht senden</button>

    </form>

  </div>

</body>
</html>
